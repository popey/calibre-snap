name: Build and test Calibre
description: Build the checked-out core24 recipe with LXD and test its installed commands
runs:
  using: composite
  steps:
    - name: Test packaging helpers
      shell: bash
      run: python3 -m unittest discover -s tests -v
    - name: Prepare LXD and Snapcraft
      shell: bash
      run: |
        if snap list lxd >/dev/null 2>&1; then
          sudo snap refresh lxd --channel=6/stable
        else
          sudo snap install lxd --channel=6/stable
        fi
        sudo lxd waitready
        sudo lxd init --auto
        # Match canonical/action-build: Docker's forwarding policy blocks LXD.
        sudo iptables -P FORWARD ACCEPT
        sudo snap install snapcraft --classic
    - name: Build with LXD
      shell: bash
      run: |
        if ! sudo snapcraft --use-lxd --verbose; then
          sudo find /root/.local/state/snapcraft/log -name '*.log' -exec cat {} +
          exit 1
        fi
    - name: Install and smoke test
      shell: bash
      run: |
        sudo snap install --dangerous ./calibre_*.snap
        mkdir -p artifacts/app-tests
        ./scripts/smoke-test.sh 2>&1 | tee artifacts/app-tests/conversions.log
    - name: Test desktop applications
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb xauth dbus-x11 openbox xdotool scrot
        timeout 10m xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- python3 scripts/gui-smoke-test.py
    - name: Upload app test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: calibre-app-tests-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/app-tests/
        if-no-files-found: warn
        retention-days: 14
    - uses: actions/upload-artifact@v4
      with:
        name: calibre-amd64-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          calibre_*.snap
          snap/snapcraft.yaml
        if-no-files-found: error
        retention-days: 14
